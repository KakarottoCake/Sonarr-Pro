name: Feature Request or Suggestion
description: An idea for something Sonarr Pro should do
labels: ['enhancement']
body:
- type: markdown
  attributes:
    value: |
      Suggestions are genuinely welcome — this fork exists because of a list of them.
      A rough idea is fine; it doesn't need to be a finished design.

- type: textarea
  attributes:
    label: What would you like it to do
  validations:
    required: true

- type: textarea
  attributes:
    label: What are you trying to accomplish
    description: >-
      The underlying problem, not just the proposed solution. There's often a simpler
      way to get the same result, and knowing the goal makes it easier to find.
  validations:
    required: true
