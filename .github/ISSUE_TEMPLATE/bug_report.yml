name: Bug Report
description: Something isn't working
labels: ['bug']
body:
- type: markdown
  attributes:
    value: |
      Thanks for taking the time to report this.

      If the problem also happens on upstream Sonarr, it's probably better reported
      [there](https://github.com/Sonarr/Sonarr/issues) — but if you're not sure, report it
      here and we'll work it out.

- type: textarea
  attributes:
    label: What happened
    description: What you expected, and what you got instead.
  validations:
    required: true

- type: input
  attributes:
    label: Series or release involved
    description: >-
      If it's about a specific show or a specific release name, put it here. Most bugs in
      this fork turn out to be specific to one title's metadata, so this is usually the
      single most useful thing in a report.
    placeholder: e.g. One Piece (AniList), or [SubsPlease] Some Show - 12 (1080p)

- type: dropdown
  attributes:
    label: Metadata source
    description: Which source is the series using, if relevant?
    options:
      - Not relevant / don't know
      - TheTVDB
      - TMDB
      - AniList
      - MyAnimeList (Jikan)

- type: textarea
  attributes:
    label: Logs
    description: >-
      Relevant lines from System → Logs. If you can reproduce it on demand, set the log
      level to Debug or Trace under Settings → General first.
    render: shell

- type: input
  attributes:
    label: Version
    description: Found under System → Status, or the image tag you pulled.
    placeholder: e.g. v1.0.0, or ghcr.io/kakarottocake/sonarr-pro:latest
  validations:
    required: true
