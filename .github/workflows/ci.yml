name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Building the solution rather than individual projects is required, not a
      # preference: Directory.Build.props pulls in stylecop.json through $(SolutionDir),
      # which is only defined for a solution build. Building a bare .csproj silently
      # drops the StyleCop configuration and fails on every using directive in the repo.
      - name: Build
        run: dotnet build src/Sonarr.sln -c Debug

      - name: Test
        run: dotnet test src/NzbDrone.Core.Test/Sonarr.Core.Test.csproj -c Debug --no-build --logger "console;verbosity=minimal"

  frontend:
    name: Lint and build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile --network-timeout 600000

      - run: yarn lint

      - run: yarn stylelint -f github

      # --env production is the difference between a real bundle and multi-megabyte
      # eval-source-map output that renders as a blank page.
      - run: yarn build --env production

  docker:
    name: Build image
    runs-on: ubuntu-latest
    # Only on pull requests. A push to main is already built and published by the
    # Docker workflow, and building it twice would just spend the runner minutes twice.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # amd64 only, and no push: this is here so a pull request cannot break the
      # image build without anyone noticing until release day.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
