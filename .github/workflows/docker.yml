name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # arm64 is built under emulation on an amd64 runner, which turns a .NET compile
      # into a very long one. Releases get both architectures because plenty of people
      # run this on a Pi or an arm NAS; the rolling "edge" tag gets amd64 only, so that
      # an ordinary push to main does not spend an hour in QEMU.
      - name: Choose platforms
        id: platforms
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires a lowercase path, and the owner name is not necessarily lowercase.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # "latest" tracks the newest release tag, never an untagged main build, so that
          # a "docker pull ...:latest" cannot land on an unreleased commit.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      # Build amd64 into the local daemon first and prove the thing actually starts.
      # A successful image build says nothing about whether the app runs: a missing
      # native dependency or a bad entrypoint only shows up at runtime, and without
      # this the first person to find out would be whoever pulled the release.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: sonarr-pro:smoketest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name smoketest -p 8989:8989 -e PUID=1000 -e PGID=1000 \
            -v "${RUNNER_TEMP}/smoke-config:/config" sonarr-pro:smoketest

          # First start migrates the database, so allow generous time before failing.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8989/ping || true)
            if [ "$code" = "200" ]; then
              echo "Responded 200 on /ping after ${i}0s"
              docker rm -f smoketest >/dev/null
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=smoketest)" ]; then
              echo "::error::Container exited before serving a request"
              docker logs smoketest
              exit 1
            fi
            sleep 10
          done

          echo "::error::/ping never returned 200"
          docker logs smoketest
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.list }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
